<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b25">
<title>TECH PLAY GAMES</title>
<style>
:root{--bg:#050b25;--panel:#091638;--cyan:#00d9ff;--blue:#087cff;--white:#f4f8ff;--muted:#a9c5e9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#102b62 0,#07132f 38%,#030817 100%);color:var(--white);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px clamp(14px,4vw,48px);background:#040a20ed;border-bottom:1px solid #087cff88;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-style:italic;font-size:clamp(17px,3vw,27px);letter-spacing:-1px}
.brand-mark{width:45px;height:38px;display:grid;place-items:center;border:2px solid var(--cyan);border-radius:12px;color:var(--cyan);font-size:22px;box-shadow:0 0 18px #00cfff66}
.brand span:last-child{background:linear-gradient(90deg,#fff,#00d9ff);background-clip:text;color:transparent}
.nav{display:flex;gap:8px;align-items:center}
.nav a{padding:11px 15px;border:1px solid transparent;border-radius:12px;color:#d8eaff;font-weight:700}
.nav a:hover,.nav a.active{border-color:var(--cyan);background:#06285a;box-shadow:0 0 15px #00cfff44}
.search{width:min(270px,28vw);padding:13px 16px;border:1px solid #087cff;border-radius:30px;background:#050e2b;color:white;font-size:15px;outline:none}
.hero{text-align:center;padding:58px 16px 42px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#087cff38,transparent 65%);pointer-events:none}
.hero-inner{position:relative;max-width:1050px;margin:auto}
.kicker{font-weight:800;letter-spacing:5px;color:#d5eaff;font-size:clamp(12px,2vw,17px)}
.hero h1{margin:15px 0 8px;font-size:clamp(39px,8vw,88px);line-height:.95;font-weight:1000;font-style:italic;letter-spacing:-3px;text-shadow:0 5px 0 #07132c,0 0 28px #008dff77}
.hero h1 span{background:linear-gradient(90deg,#00e5ff,#1684ff);background-clip:text;color:transparent}
.tagline{font-weight:800;letter-spacing:5px;color:#d9eaff;font-size:clamp(13px,2.5vw,21px);margin-top:22px}
.play-link{display:inline-block;margin-top:28px;padding:15px 35px;border-radius:40px;background:linear-gradient(100deg,#087cff,#00dfff);font-weight:900;font-size:18px;box-shadow:0 0 25px #00aaff88}
.section{max-width:1320px;margin:0 auto;padding:24px clamp(14px,3vw,34px) 60px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;padding:13px 18px;border:1px solid #087cffaa;border-radius:18px;background:linear-gradient(90deg,#09295a,#07142e)}
.section-head h2{margin:0;font-size:clamp(18px,3vw,27px);font-style:italic;letter-spacing:1px}
.count{color:var(--cyan);font-weight:800;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.game-card{display:block;min-width:0;overflow:hidden;border:1px solid #168bff;border-radius:19px;background:#07132d;box-shadow:0 8px 24px #0008;transition:transform .18s,border-color .18s,box-shadow .18s}
.game-card:hover{transform:translateY(-5px);border-color:#00e5ff;box-shadow:0 0 22px #008cff77}
.art{height:clamp(105px,15vw,180px);position:relative;overflow:hidden;display:grid;place-items:center;background:var(--artbg);isolation:isolate}
.art:before,.art:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);z-index:-1}
.art:before{width:170px;height:170px;right:-50px;top:-70px;background:#ffffff20}
.art:after{width:130px;height:130px;left:-50px;bottom:-70px;background:#00eaff30}
.art svg{width:72%;height:78%;filter:drop-shadow(0 8px 8px #0008)}
.art-label{position:absolute;left:9px;top:9px;padding:5px 8px;border-radius:20px;background:#02081799;border:1px solid #ffffff55;font-size:10px;font-weight:800;letter-spacing:1px}
.game-name{padding:12px 10px 14px;text-align:center;font-weight:900;font-size:clamp(13px,1.5vw,17px);background:linear-gradient(#07132d,#020817)}
.game-card:focus-visible,.nav a:focus-visible,.play-link:focus-visible{outline:3px solid white;outline-offset:3px}
.no-results{display:none;text-align:center;padding:35px;color:var(--muted)}
.footer{text-align:center;padding:25px 15px;border-top:1px solid #087cff55;color:#8eacd5;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topbar{flex-wrap:wrap}.nav{order:3;width:100%;justify-content:center}.search{width:210px}}
@media(max-width:560px){.topbar{gap:10px}.brand{font-size:18px}.brand-mark{width:38px;height:34px}.nav a{padding:9px 10px;font-size:13px}.search{width:100%;order:2}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.art{height:125px}.hero{padding-top:43px}.section-head{align-items:flex-start;flex-direction:column}.game-name{font-size:14px}}
</style>
</head>
<body>
<header class="topbar" id="home">
  <a class="brand" href="#home" aria-label="Tech Play Games home"><span class="brand-mark">TP</span><span>TECH PLAY GAMES</span></a>
  <nav class="nav" aria-label="Main navigation">
    <a class="active" href="#home">Home</a>
    <a href="#all-games">All Games</a>
    <a href="#all-games">Categories</a>
  </nav>
  <input class="search" id="search" type="search" placeholder="⌕  Search games..." aria-label="Search games">
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="kicker">30 GAMES · ENDLESS FUN</div>
    <h1>TECH PLAY <span>GAMES</span></h1>
    <div class="tagline">PLAY · EXPLORE · ENJOY</div>
    <a class="play-link" href="#all-games">▶ &nbsp; PLAY NOW</a>
  </div>
</section>

<main class="section" id="all-games">
  <div class="section-head">
    <h2>✦ &nbsp; ALL GAMES</h2>
    <span class="count"><span id="shown">30</span> GAMES</span>
  </div>
  <div class="grid" id="gameGrid"></div>
  <div class="no-results" id="noResults">No games found. Try another search.</div>
</main>
<footer class="footer">© TECH PLAY GAMES · PLAY · EXPLORE · ENJOY</footer>

}
const grid=document.getElementById("gameGrid");
function render(list){
 grid.innerHTML="";
 list.forEach((g,i)=>{
   const a=document.createElement("a");
   a.className="game-card"; a.href="games/"+g.file;
   a.setAttribute("aria-label","Play "+g.name);
   a.innerHTML=`<div class="art" style="--artbg:linear-gradient(135deg,${g.colors[0]},${g.colors[1]})"><span class="art-label">${g.type}</span>${artSVG(g.shape)}</div><div class="game-name">${String(i+1).padStart(2,"0")} · ${g.name}</div>`;
   grid.appendChild(a);
 });
 document.getElementById("shown").textContent=list.length;
 document.getElementById("noResults").style.display=list.length?"none":"block";
}
render(games);
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.trim().toLowerCase();
 render(games.filter(g=>g.name.toLowerCase().includes(q)||g.type.toLowerCase().includes(q)));
});
</script>
