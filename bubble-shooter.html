<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050b20"><title>Bubble Shooter | TECH PLAY GAMES</title><link rel="stylesheet" href="../game.css"></head>
<body><header><a href="../index.html">← TECH PLAY GAMES</a><strong>Bubble Shooter</strong></header>
<main><section class="panel" id="intro"><h1>Bubble Shooter</h1><p id="gameDesc"></p><p class="note" id="controlHint"></p><button id="startBtn">▶ CHOOSE PLAY MODE</button></section>
<section id="game" class="panel"><div id="modePicker"><h2>Choose Your Mode</h2><div class="mode-select"><button class="mode-card selected" data-mode="friend"><b>👥 Play with Friend</b><small>Two players on the same device. P1 uses WASD; P2 uses arrow keys.</small></button><button class="mode-card" data-mode="bot"><b>🤖 Play with Bot</b><small>Challenge the computer at your chosen difficulty.</small></button></div><div id="difficultyWrap" class="hidden"><label for="difficulty">Bot difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></div><div class="row"><button id="launchBtn">START GAME ▶</button><button id="backBtn" class="secondary">← Back</button></div></div>
<div id="playArea" class="hidden"><div class="status"><span>P1 score: <b id="score">0</b></span><span>P2/Bot score: <b id="lives">0</b></span></div>
<div id="ticMode" class="hidden"><p id="ticStatus"></p><div id="ticBoard"></div><div class="row center"><button id="ticReset" class="secondary">New Round</button></div></div>
<div id="arcadeArea"><canvas id="board" width="800" height="500" aria-label="Bubble Shooter game area"></canvas><div class="controls"><div><span class="player-tag">P1 · WASD</span><div class="pad"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div></div><div><span class="player-tag">P2 · ARROWS / BOT</span><div class="pad"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div></div><div class="row center"><button id="restartBtn" class="secondary">↻ Restart</button></div></div>
<div class="row center" style="margin-top:14px"><button id="backBtn" class="secondary" onclick="location.reload()">← Change Mode</button><a class="btn" href="../index.html">Game Library</a></div></div></section></main><footer>TECH PLAY GAMES · Friend and Bot modes</footer>
<script>window.GAME_CONFIG={"name": "Bubble Shooter", "mode": "collect", "description": "Move around and collect bright bubbles in a colorful arcade field.", "controls": "Use arrows/WASD or tap the field.", "objective": "Collect the bubbles.", "kind": "collect"};</script><script src="../engine.js"></script></body></html>
