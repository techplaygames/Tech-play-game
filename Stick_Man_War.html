<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10101c"><title>Stick Man War | TECHNO PLAY GAMES</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080914;color:#fff;font-family:system-ui,Arial;touch-action:none}#stage{position:relative;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#24233a,#080914 75%)}canvas{width:100%;height:auto;max-height:100dvh;aspect-ratio:16/9;object-fit:contain;display:block;box-shadow:0 0 35px #0ce8ff30}#hud{position:absolute;top:calc(50% - min(28.125vw,50dvh) + 8px);left:50%;transform:translateX(-50%);width:min(98vw,1100px);display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #000}.side{width:31%;}.name{font-size:clamp(9px,2vw,16px);letter-spacing:1px}.bar{height:13px;background:#161b2c;border:2px solid #d8e6ff;border-radius:3px;overflow:hidden;margin-top:3px;box-shadow:0 0 12px #35cfff80}.fill{height:100%;width:100%;background:linear-gradient(90deg,#2de5ff,#63ed89)}#hp2{background:linear-gradient(90deg,#ffb14c,#ff466d)}#timer{font-size:clamp(18px,4vw,30px);background:#101525;border:3px solid #f6d77b;border-radius:50%;padding:7px 12px;min-width:64px;text-align:center}.right{text-align:right}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050713c9;padding:20px}#card{width:min(92vw,430px);text-align:center;padding:22px;border:1px solid #5eeaff;border-radius:18px;background:linear-gradient(145deg,#19263d,#171226);box-shadow:0 0 35px #16cfff55}h1{font-size:clamp(26px,7vw,42px);margin:0;color:#78eaff;text-shadow:0 0 18px #00bfff}p{color:#cbd8ed;line-height:1.45}button{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(100deg,#11c8f5,#426dff);color:#06101c;font-weight:950;font-size:15px}#touch{position:absolute;bottom: max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 3%;pointer-events:none}.cluster{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}.ctrl{width:45px;height:45px;border-radius:50%;background:#15243bcc;border:1px solid #9ceaff;color:#fff;box-shadow:0 0 12px #0acfff55;padding:0;font-size:11px;touch-action:none}.act{width:52px;height:52px;background:#34203dcc;border-color:#ffca7d}.small{font-size:9px}#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:9px;color:#c6c9d7;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
@media(min-width:900px){.ctrl{width:58px;height:58px}.act{width:64px;height:64px}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}}
</style></head><body><div id="stage"><canvas id="game" width="960" height="540"></canvas>
<div id="hud"><div class="side"><div class="name">⚡ RUTO BEAST</div><div class="bar"><div class="fill" id="hp1"></div></div></div><div id="timer">90</div><div class="side right"><div class="name">DARA SIX PATH</div><div class="bar"><div class="fill" id="hp2"></div></div></div></div>
<div id="overlay"><div id="card"><h1>STICK MAN WAR</h1><p>Anime-inspired energy battle! Move, dodge and use fantasy power moves. No graphic injuries.</p><p><b>PLAYER:</b> Move with ◀ ▶, jump with ▲, tap POWER for an energy burst.</p><button id="start">START BATTLE</button></div></div>
<div id="touch"><div class="cluster"><div class="pad"><span></span><button class="ctrl" data-key="up">▲</button><span></span><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="down">▼</button><button class="ctrl" data-key="right">▶</button></div></div><div class="cluster"><button class="ctrl act" data-key="guard">GUARD</button><button class="ctrl act" data-key="power">POWER</button><button class="ctrl act" data-key="jump">JUMP</button></div></div><div id="hint">Keyboard: A / D move · W jump · J power · K guard</div></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let keys={},running=false,p1,p2,shots=[],sparks=[],time=90,last=0,aiTick=0,shake=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fighter(px,color,glow,face){return{x:px,y:390,vx:0,vy:0,hp:100,color,glow,face,ground:true,cool:0,guard:0,flash:0}}
function reset(){p1=fighter(220,'#ffe6a2','#ffbd35',1);p2=fighter(740,'#d7f5ff','#46cfff',-1);shots=[];sparks=[];time=90;running=true;last=performance.now();$('overlay').style.display='none';requestAnimationFrame(loop)}
function bg(){let g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#171a35');g.addColorStop(.55,'#6a3e4b');g.addColorStop(1,'#211d32');x.fillStyle=g;x.fillRect(0,0,960,540);for(let i=0;i<7;i++){x.fillStyle=`rgba(255,${100+i*9},65,${.025+i*.006})`;x.beginPath();x.ellipse(100+i*145,400,180,45,0,0,7);x.fill()}x.fillStyle='#151a2b';x.fillRect(0,430,960,110);x.strokeStyle='#f6a95a55';x.lineWidth=3;x.beginPath();x.moveTo(0,430);x.lineTo(960,430);x.stroke();for(let i=0;i<18;i++){let xx=(i*83+((time*9)%83))%960;x.fillStyle='#ffc06b22';x.fillRect(xx,445+(i%4)*20,2,18)}}
function stick(f){x.save();x.translate(f.x,f.y);x.scale(f.face,1);x.shadowColor=f.glow;x.shadowBlur=18;x.lineCap='round';x.lineJoin='round';let bob=f.ground?Math.sin(performance.now()/100+f.x)*2:0;x.translate(0,bob);x.strokeStyle=f.color;x.lineWidth=10;x.beginPath();x.arc(0,-88,19,0,Math.PI*2);x.stroke();x.lineWidth=13;x.beginPath();x.moveTo(0,-68);x.lineTo(0,-22);x.moveTo(0,-58);x.lineTo(-24,-37);x.moveTo(0,-58);x.lineTo(25,-40);x.moveTo(0,-22);x.lineTo(-18,0);x.moveTo(0,-22);x.lineTo(18,0);x.stroke();x.shadowBlur=0;x.fillStyle=f.color;x.beginPath();x.ellipse(0,-87,5,3,0,0,7);x.fill();if(f.guard){x.strokeStyle='#8ef7ff';x.lineWidth=5;x.beginPath();x.arc(25,-52,37,-1.2,1.2);x.stroke()}if(f.flash){x.fillStyle='#fff';x.globalAlpha=.6;x.beginPath();x.arc(0,-50,50,0,7);x.fill()}x.restore()}
function blast(s){let grd=x.createRadialGradient(s.x,s.y,2,s.x,s.y,s.r);grd.addColorStop(0,'#fff');grd.addColorStop(.25,s.color);grd.addColorStop(1,'#ffb52b00');x.fillStyle=grd;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.strokeStyle=s.color;x.lineWidth=5;x.beginPath();x.moveTo(s.x-s.r*2,s.y);x.lineTo(s.x+s.r*2,s.y);x.stroke()}
function fire(f,owner){if(f.cool>0)return;f.cool=owner?42:58;shots.push({x:f.x+f.face*35,y:f.y-60,vx:f.face*(owner?9:7),r:owner?30:25,color:owner?'#ffcf52':'#63eaff',owner,life:90});for(let i=0;i<10;i++)sparks.push({x:f.x,y:f.y-55,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:24,color:owner?'#ffc65b':'#7ceaff'})}
function update(dt){if(!running)return;time-=dt/1000;if(time<=0){time=0;finish()}let a=(keys.left||keys.a)?-1:0;a+=(keys.right||keys.d)?1:0;p1.vx=a*4.4;if((keys.up||keys.w||keys.jump)&&p1.ground){p1.vy=-12;p1.ground=false}if(keys.guard||keys.k)p1.guard=1;else p1.guard=0;if(keys.power||keys.j)fire(p1,true);p1.x=clamp(p1.x+p1.vx,35,925);p1.vy+=.55;p1.y+=p1.vy;if(p1.y>=390){p1.y=390;p1.vy=0;p1.ground=true}if(p1.cool>0)p1.cool--;if(p1.flash>0)p1.flash--;
// Computer opponent: approaches, jumps occasionally, guards and launches fantasy energy orbs.
aiTick+=dt;let dx=p1.x-p2.x;p2.vx=Math.abs(dx)>155?Math.sign(dx)*2.25:0;if(Math.abs(dx)<150&&p2.cool<=0&&Math.random()<.035)fire(p2,false);if(p2.ground&&Math.random()<.009){p2.vy=-10;p2.ground=false}p2.x=clamp(p2.x+p2.vx,35,925);p2.vy+=.5;p2.y+=p2.vy;if(p2.y>=390){p2.y=390;p2.vy=0;p2.ground=true}if(p2.cool>0)p2.cool--;if(p2.flash>0)p2.flash--;
for(let s of shots){s.x+=s.vx;s.life--;let target=s.owner?p2:p1;if(Math.abs(s.x-target.x)<38&&Math.abs(s.y-(target.y-55))<58&&s.life>0){if(!target.guard){target.hp=Math.max(0,target.hp-(s.owner?8:6));target.flash=8;shake=7;for(let i=0;i<12;i++)sparks.push({x:target.x,y:target.y-55,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:25,color:s.color})}s.life=0}}shots=shots.filter(s=>s.life>0&&s.x>-80&&s.x<1040);for(let q of sparks){q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.life--}sparks=sparks.filter(q=>q.life>0);$('hp1').style.width=p1.hp+'%';$('hp2').style.width=p2.hp+'%';$('timer').textContent=Math.ceil(time);if(p1.hp<=0||p2.hp<=0)finish()}
function draw(){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8}bg();for(let i=0;i<3;i++){x.strokeStyle='#ffc16b18';x.lineWidth=2;x.beginPath();x.ellipse(480,430,120+i*70,18+i*7,0,0,7);x.stroke()}shots.forEach(blast);stick(p1);stick(p2);for(let q of sparks){x.globalAlpha=q.life/25;x.fillStyle=q.color;x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()}x.globalAlpha=1;x.restore();}
function loop(now){if(!running)return;let dt=Math.min(32,now-last);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}function finish(){if(!running)return;running=false;let title=p1.hp===p2.hp?'DRAW!':p1.hp>p2.hp?'YOU WIN!':'CPU WINS!';$('card').innerHTML=`<h1>${title}</h1><p>Battle complete. Player energy: ${Math.ceil(p1.hp)}% · Rival energy: ${Math.ceil(p2.hp)}%</p><button id="again">PLAY AGAIN</button>`;$('overlay').style.display='flex';$('again').onclick=reset}
$('start').onclick=reset;document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});draw();})();
</script></body></html>
